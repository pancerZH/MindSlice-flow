name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, so a new mindslice release that breaks the flow shows up without a push
  workflow_dispatch:
  workflow_call:  # publish.yml runs the full matrix before a release

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false  # a failure on one platform should not hide the others
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.12"]
        include:
          - os: ubuntu-24.04
            python: "3.x"  # the newest Python
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the MindSlice engine
        run: python -m pip install --upgrade mindslice
      # The functional tests are skipped without the engine; fail here instead of passing without them.
      - name: Engine version
        run: mindslice --version
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
